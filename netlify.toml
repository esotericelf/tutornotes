[build]
  # Build command
  command = "npm run build"

  # Publish directory
  publish = "build"

  # Environment variables
  [build.environment]
    NODE_VERSION = "18"
    NPM_VERSION = "9"
    # Disable secrets scanning for expected environment variables
    SECRETS_SCAN_OMIT_KEYS = "REACT_APP_SUPABASE_ANON_KEY,REACT_APP_SUPABASE_URL,REACT_APP_SUPABASE_SERVICE_ROLE_KEY"

# Redirects for React Router - only valid routes get SPA
# Valid React routes
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/changelog"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/question-demo"
  to = "/index.html"
  status = 200

# DSE_Math routes (with parameters)
[[redirects]]
  from = "/DSE_Math/*"
  to = "/index.html"
  status = 200

# Quiz routes
[[redirects]]
  from = "/quiz/take"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/quiz/results"
  to = "/index.html"
  status = 200

# Debug routes (protected)
[[redirects]]
  from = "/debug/topic-tags"
  to = "/index.html"
  status = 200

# All other routes - SPA fallback (must be last)
# This handles topic/tag routes (both English and Chinese) and any other React Router routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Content-Security-Policy = "default-src 'self' http: https: data: blob: 'unsafe-inline'; connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co wss://*.supabase.in; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co; style-src 'self' 'unsafe-inline' https://*.supabase.co;"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
